services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eveops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eveops
    volumes:
      - eveops-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eveops -d eveops"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        VITE_PUBLIC_HOSTNAME: ${VITE_PUBLIC_HOSTNAME:-eveopsgroup.cloud}
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://eveops:${POSTGRES_PASSWORD}@db:5432/eveops
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ["public"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:-eveopsgroup.cloud}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  eveops-db:
  caddy-data:
  caddy-config:
